<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한 걸음 서클 (One-Step Circle) - 실천 & 공유 툴킷</title>
    <!-- React, ReactDOM, Babel, Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // 메인 탭: 'circle' (서클 실천), 'dashboard' (친구들의 마음 보드), 'badges' (내 배지 모음집)
            const [activeTab, setActiveTab] = useState('circle');
            const [step, setStep] = useState(1);
            
            // 1단계: 마음 체크인
            const [selectedEmoji, setSelectedEmoji] = useState(null);
            const [nickname, setNickname] = useState('');
            const [checkinNote, setCheckinNote] = useState('');
            
            // 2단계: 3대 최소 행동 시뮬레이션
            const [selectedScenario, setSelectedScenario] = useState(null);
            const [selectedAction, setSelectedAction] = useState(null);
            const [practiceScript, setPracticeScript] = useState('');

            // 3단계: 회복적 질문 툴킷
            const [restorativeAnswers, setRestorativeAnswers] = useState({ q1: '', q2: '', q3: '', q4: '' });

            // 4단계: 셀프 평가 & 완료
            const [confidence, setConfidence] = useState(4);

            // 데이터 저장소 (LocalStorage 연동)
            const [savedBadges, setSavedBadges] = useState([]);
            const [classFeed, setClassFeed] = useState([]);

            // 초창기 샘플 데이터 초기화 (다른 사람들이 남긴 메시지 예시)
            useEffect(() => {
                const initialFeed = [
                    { id: 1, name: '민우', emoji: '😊', text: '오늘 날씨 좋아서 기분 최고! 다들 파이팅하자', date: '오늘 오전 08:50', action: '곁에 있기' },
                    { id: 2, name: '지윤', emoji: '😴', text: '월요일이라 조금 피곤하지만 발표 열심히 해야지', date: '오늘 오전 08:55', action: '분위기 돌리기' },
                    { id: 3, name: '서준', emoji: '🤝', text: '상처받은 친구 있으면 언제든 나한테 말해줘!', date: '오늘 오전 09:10', action: '어른에게 알리기' }
                ];
                
                const localBadges = JSON.parse(localStorage.getItem('my_circle_badges') || '[]');
                const localFeed = JSON.parse(localStorage.getItem('class_circle_feed') || JSON.stringify(initialFeed));
                
                setSavedBadges(localBadges);
                setClassFeed(localFeed);
            }, []);

            const emojis = [
                { emoji: '😊', label: '평온함' },
                { emoji: '😟', label: '불안함' },
                { emoji: '😤', label: '답답함' },
                { emoji: '😴', label: '피곤함' },
                { emoji: '🤝', label: '연결됨' }
            ];

            const scenarios = [
                { id: 1, title: '📱 단톡방 외면·조롱 상황', desc: '단톡방에서 특정 친구의 사진을 두고 놀림이 이어지며 당사자는 아무 말도 하지 못함.' },
                { id: 2, title: '🍱 급식실 소외 및 은따 상황', desc: '급식실에서 특정 친구가 앉으려 하자 주변 아이들이 자리를 옮기며 혼자 남겨둠.' },
                { id: 3, title: '🗣️ 복도 언어적 시비 상황', desc: '쉬는 시간 복도에서 지나가는 친구에게 기분 나쁜 별명을 부르며 지속적인 시비를 검.' }
            ];

            const actions = [
                { id: 'stay', title: '① 곁에 있기 (소속감 전하기)', guide: '조용히 개인 메시지나 메신저로 든든한 지지를 전합니다.', example: '"괜찮아? 나는 네 편이야. 같이 매점 갈래?"' },
                { id: 'redirect', title: '② 분위기 돌리기 (장면 전환)', guide: '상황을 자연스럽게 끊거나 다른 주제로 화제를 돌립니다.', example: '"아 맞다, 우리 다음 시간 수행평가 제출 언제까지지?"' },
                { id: 'report', title: '③ 어른에게 알리기 (안전 연계)', guide: '혼자 해결하려 하지 않고 담임선생님이나 Wee클래스에 알립니다.', example: '"선생님, 단톡방에서 이런 일이 지속돼서 도움이 필요해요."' }
            ];

            // 실천 완료 및 저장 핸들러
            const handleComplete = () => {
                const newBadge = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }),
                    emoji: selectedEmoji,
                    nickname: nickname || '익명 조력자',
                    note: checkinNote || '오늘도 친구를 돕는 한 걸음!',
                    actionTitle: selectedAction?.title,
                    script: practiceScript,
                    confidence: confidence
                };

                const updatedBadges = [newBadge, ...savedBadges];
                const updatedFeed = [{
                    id: Date.now(),
                    name: nickname || '익명 조력자',
                    emoji: selectedEmoji,
                    text: checkinNote || '함께 평화로운 반을 만들어요!',
                    date: '방금 전',
                    action: selectedAction?.title.split(' ')[1] || '조력 행동'
                }, ...classFeed];

                setSavedBadges(updatedBadges);
                setClassFeed(updatedFeed);
                localStorage.setItem('my_circle_badges', JSON.stringify(updatedBadges));
                localStorage.setItem('class_circle_feed', JSON.stringify(updatedFeed));

                setActiveTab('badges'); // 완성이 되면 내 배지 모음집으로 이동
                // 초기화
                setStep(1);
                setSelectedEmoji(null);
                setSelectedScenario(null);
                setSelectedAction(null);
                setPracticeScript('');
                setCheckinNote('');
            };

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col font-sans">
                    {/* Header */}
                    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-20 shadow-md">
                        <div class="flex justify-between items-center mb-2">
                            <div>
                                <h1 class="font-black text-lg tracking-tight flex items-center gap-2">
                                    <span>⭕</span> 한 걸음 서클
                                </h1>
                                <p class="text-xs text-indigo-200">청소년 또래관계 증진 12주 툴킷</p>
                            </div>
                            {activeTab === 'circle' && (
                                <span class="text-xs bg-indigo-700/80 border border-indigo-400/30 px-3 py-1 rounded-full font-bold">
                                    Step {step} / 4
                                </span>
                            )}
                        </div>

                        {/* Navigation Bar */}
                        <div class="flex gap-1 bg-indigo-800/40 p-1 rounded-xl text-xs font-semibold">
                            <button 
                                onClick={() => setActiveTab('circle')} 
                                class={`flex-1 py-2 rounded-lg text-center transition ${activeTab === 'circle' ? 'bg-white text-indigo-900 shadow-sm font-bold' : 'text-indigo-200 hover:text-white'}`}
                            >
                                <i class="fa-solid fa-pen-to-square mr-1"></i> 서클 실천
                            </button>
                            <button 
                                onClick={() => setActiveTab('dashboard')} 
                                class={`flex-1 py-2 rounded-lg text-center transition ${activeTab === 'dashboard' ? 'bg-white text-indigo-900 shadow-sm font-bold' : 'text-indigo-200 hover:text-white'}`}
                            >
                                <i class="fa-solid fa-comments mr-1"></i> 우리 반 마음보드
                            </button>
                            <button 
                                onClick={() => setActiveTab('badges')} 
                                class={`flex-1 py-2 rounded-lg text-center transition relative ${activeTab === 'badges' ? 'bg-white text-indigo-900 shadow-sm font-bold' : 'text-indigo-200 hover:text-white'}`}
                            >
                                <i class="fa-solid fa-award mr-1"></i> 내 배지함 ({savedBadges.length})
                            </button>
                        </div>
                    </header>

                    {/* Progress Bar (Only in Circle Tab) */}
                    {activeTab === 'circle' && (
                        <div class="w-full bg-slate-100 h-1.5">
                            <div class="bg-indigo-500 h-1.5 transition-all duration-300" style={{ width: `${(step / 4) * 100}%` }}></div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main class="flex-1 p-5 overflow-y-auto custom-scrollbar">
                        
                        {/* TAB 1: 서클 실천 모듈 */}
                        {activeTab === 'circle' && (
                            <div>
                                {step === 1 && (
                                    <div class="space-y-5 animate-fade-in">
                                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                            <h2 class="text-indigo-950 font-bold text-base mb-1">Step 1. 오늘 나의 마음 체크인</h2>
                                            <p class="text-xs text-indigo-700 leading-relaxed">익명으로 가볍게 표현해보세요. 내 마음 상태를 공유하는 것이 안전한 소통의 시작입니다.</p>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-1">닉네임 (선택)</label>
                                            <input 
                                                type="text" 
                                                placeholder="예: 2반 친구, 따뜻한 곰돌이"
                                                value={nickname}
                                                onChange={(e) => setNickname(e.target.value)}
                                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-2">오늘 나의 감정 상태</label>
                                            <div class="grid grid-cols-5 gap-2">
                                                {emojis.map((item, idx) => (
                                                    <button 
                                                        key={idx}
                                                        onClick={() => setSelectedEmoji(item.emoji)}
                                                        class={`p-3 rounded-xl border flex flex-col items-center justify-center transition-all ${
                                                            selectedEmoji === item.emoji 
                                                            ? 'border-indigo-600 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-400' 
                                                            : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-600'
                                                        }`}
                                                    >
                                                        <span class="text-2xl mb-1">{item.emoji}</span>
                                                        <span class="text-xs font-medium">{item.label}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-1">오늘 반 친구들에게 한 줄 전하고 싶은 말</label>
                                            <textarea 
                                                rows="2"
                                                placeholder="예: 오늘 다들 시험 준비하느라 수고했어!"
                                                value={checkinNote}
                                                onChange={(e) => setCheckinNote(e.target.value)}
                                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            ></textarea>
                                        </div>

                                        <button 
                                            disabled={!selectedEmoji}
                                            onClick={() => setStep(2)}
                                            class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-40 hover:bg-indigo-700 shadow-md transition"
                                        >
                                            다음: 3대 조력 행동 선택 →
                                        </button>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div class="space-y-5">
                                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                            <h2 class="text-indigo-950 font-bold text-base mb-1">Step 2. 3대 최소 조력 행동 연습</h2>
                                            <p class="text-xs text-indigo-700 leading-relaxed">거창한 문제 해결사가 아니어도 괜찮습니다. 내가 할 수 있는 작은 행동 한 가지를 연습해보세요.</p>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-2">1) 연습할 가상 갈등 상황</label>
                                            <div class="space-y-2">
                                                {scenarios.map((sc) => (
                                                    <div 
                                                        key={sc.id}
                                                        onClick={() => setSelectedScenario(sc)}
                                                        class={`p-3.5 border rounded-xl cursor-pointer text-sm transition ${
                                                            selectedScenario?.id === sc.id 
                                                            ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-400' 
                                                            : 'border-slate-200 bg-white hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        <div class="font-bold text-slate-800 mb-1">{sc.title}</div>
                                                        <div class="text-xs text-slate-600 leading-relaxed">{sc.desc}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {selectedScenario && (
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 mb-2">2) 내가 실천할 최소 조력 행동</label>
                                                <div class="space-y-2">
                                                    {actions.map((act) => (
                                                        <div 
                                                            key={act.id}
                                                            onClick={() => setSelectedAction(act)}
                                                            class={`p-3.5 border rounded-xl cursor-pointer text-sm transition ${
                                                                selectedAction?.id === act.id 
                                                                ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-400' 
                                                                : 'border-slate-200 bg-white hover:bg-slate-50'
                                                            }`}
                                                        >
                                                            <div class="font-bold text-indigo-950 mb-1">{act.title}</div>
                                                            <div class="text-xs text-slate-600 mb-2">{act.guide}</div>
                                                            <div class="text-xs bg-slate-100 p-2 rounded-lg text-slate-700 font-mono">예시: {act.example}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {selectedAction && (
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 mb-1">3) 내가 직접 소리 내어 말해볼 한 문장</label>
                                                <textarea 
                                                    rows="2"
                                                    placeholder="선택한 행동에 맞추어 실제 상황에서 말할 문장을 입력하세요."
                                                    value={practiceScript}
                                                    onChange={(e) => setPracticeScript(e.target.value)}
                                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                ></textarea>
                                            </div>
                                        )}

                                        <div class="flex gap-2 pt-2">
                                            <button onClick={() => setStep(1)} class="w-1/3 py-3 border border-slate-300 text-slate-600 rounded-xl font-medium text-sm">
                                                ← 이전
                                            </button>
                                            <button 
                                                disabled={!selectedScenario || !selectedAction || !practiceScript}
                                                onClick={() => setStep(3)}
                                                class="w-2/3 py-3 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-40 hover:bg-indigo-700 shadow-md transition"
                                            >
                                                다음: 회복적 질문 툴킷 →
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div class="space-y-4">
                                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                            <h2 class="text-indigo-950 font-bold text-base mb-1">Step 3. 회복적 4대 질문 성찰</h2>
                                            <p class="text-xs text-indigo-700 leading-relaxed">비난이나 처벌 대신 사건의 영향을 살피고 관계를 바로잡는 대화법을 생각합니다.</p>
                                        </div>

                                        <div class="space-y-3 text-xs">
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">1. 무슨 일이 일어났나요? (사건 파악)</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="사실 위주로 상황을 정리해봅니다."
                                                    value={restorativeAnswers.q1}
                                                    onChange={(e) => setRestorativeAnswers({...restorativeAnswers, q1: e.target.value})}
                                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"
                                                />
                                            </div>
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">2. 그때 어떤 기분이었나요? (정서 확인)</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="당시 솔직한 마음 상태"
                                                    value={restorativeAnswers.q2}
                                                    onChange={(e) => setRestorativeAnswers({...restorativeAnswers, q2: e.target.value})}
                                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"
                                                />
                                            </div>
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">3. 누가 어떤 영향을 받았을까요? (영향 탐색)</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="상대방이나 학급 전체가 느꼈을 상처나 영향"
                                                    value={restorativeAnswers.q3}
                                                    onChange={(e) => setRestorativeAnswers({...restorativeAnswers, q3: e.target.value})}
                                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"
                                                />
                                            </div>
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">4. 바로잡으려면 무엇이 필요한가요? (회복 이행)</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="진심 어린 사과, 대화, 약속 등"
                                                    value={restorativeAnswers.q4}
                                                    onChange={(e) => setRestorativeAnswers({...restorativeAnswers, q4: e.target.value})}
                                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"
                                                />
                                            </div>
                                        </div>

                                        <div class="flex gap-2 pt-2">
                                            <button onClick={() => setStep(2)} class="w-1/3 py-3 border border-slate-300 text-slate-600 rounded-xl font-medium text-sm">
                                                ← 이전
                                            </button>
                                            <button 
                                                disabled={!restorativeAnswers.q1 || !restorativeAnswers.q4}
                                                onClick={() => setStep(4)}
                                                class="w-2/3 py-3 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-40 hover:bg-indigo-700 shadow-md transition"
                                            >
                                                다음: 최종 확인 & 저장 →
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div class="space-y-5">
                                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                            <h2 class="text-indigo-950 font-bold text-base mb-1">Step 4. 자신감 평가 & 실천 약속</h2>
                                            <p class="text-xs text-indigo-700">연습을 통해 내가 친구를 도울 준비가 얼마나 되었는지 스스로 평가해봅니다.</p>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-3">도움 행동 자신감 점수</label>
                                            <div class="flex justify-between gap-2">
                                                {[1, 2, 3, 4, 5].map((num) => (
                                                    <button 
                                                        key={num}
                                                        onClick={() => setConfidence(num)}
                                                        class={`flex-1 py-3 rounded-xl font-black text-sm transition ${
                                                            confidence === num 
                                                            ? 'bg-indigo-600 text-white shadow-lg ring-2 ring-indigo-400' 
                                                            : 'bg-slate-100 text-slate-600 border border-slate-200'
                                                        }`}
                                                    >
                                                        {num}점
                                                    </button>
                                                ))}
                                            </div>
                                            <div class="flex justify-between text-xs text-slate-400 mt-2 px-1">
                                                <span>망설여짐</span>
                                                <span>확실함</span>
                                            </div>
                                        </div>

                                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-xs text-amber-900 space-y-1">
                                            <div class="font-bold flex items-center gap-1 text-amber-700">
                                                <i class="fa-solid fa-triangle-exclamation"></i> 안전 가이드라인
                                            </div>
                                            <p class="text-amber-800 leading-relaxed">
                                                심각한 학교폭력이나 자해 위험 등 혼자 다루기 힘든 상황은 즉시 **담임선생님**이나 **Wee클래스 전문상담선생님**에게 연결해야 합니다.
                                            </p>
                                        </div>

                                        <button 
                                            onClick={handleComplete}
                                            class="w-full py-4 bg-emerald-600 text-white rounded-xl font-black shadow-xl hover:bg-emerald-700 transition text-base flex items-center justify-center gap-2"
                                        >
                                            <span>🎖️</span> 한 걸음 실천 배지 획득하기!
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 2: 우리 반 마음보드 (실시간 피드 및 다른 사람들의 반응) */}
                        {activeTab === 'dashboard' && (
                            <div class="space-y-4">
                                <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex justify-between items-center">
                                    <div>
                                        <h2 class="text-indigo-950 font-bold text-sm">💬 우리 반 마음 루틴 대시보드</h2>
                                        <p class="text-xs text-indigo-700">오늘 친구들이 남긴 감정과 응원의 메시지입니다.</p>
                                    </div>
                                    <span class="text-xs bg-indigo-200 text-indigo-800 px-2.5 py-1 rounded-full font-bold">
                                        총 {classFeed.length}개
                                    </span>
                                </div>

                                <div class="space-y-2.5">
                                    {classFeed.map((item) => (
                                        <div key={item.id} class="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm flex gap-3 items-start">
                                            <div class="text-3xl bg-slate-100 p-2 rounded-xl flex items-center justify-center">
                                                {item.emoji}
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex justify-between items-center mb-1">
                                                    <span class="font-bold text-xs text-slate-800">{item.name}</span>
                                                    <span class="text-[10px] text-slate-400">{item.date}</span>
                                                </div>
                                                <p class="text-xs text-slate-700 leading-relaxed mb-1.5">{item.text}</p>
                                                {item.action && (
                                                    <span class="inline-block text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-semibold border border-indigo-100">
                                                        약속한 행동: {item.action}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: 나의 한 걸음 배지 모음집 */}
                        {activeTab === 'badges' && (
                            <div class="space-y-4">
                                <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                    <h2 class="text-indigo-950 font-bold text-sm">🏆 나의 실천 배지 컬렉션</h2>
                                    <p class="text-xs text-indigo-700">12주간 내가 수집한 또래조력 실천 배지 기록입니다.</p>
                                </div>

                                {savedBadges.length === 0 ? (
                                    <div class="text-center py-12 text-slate-400 space-y-3">
                                        <div class="text-4xl">🎖️</div>
                                        <p class="text-xs">아직 수집한 배지가 없습니다.<br/>서클 실천을 진행해 첫 배지를 받아보세요!</p>
                                        <button 
                                            onClick={() => setActiveTab('circle')}
                                            class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold"
                                        >
                                            배지 모으러 가기
                                        </button>
                                    </div>
                                ) : (
                                    <div class="grid grid-cols-1 gap-3">
                                        {savedBadges.map((badge) => (
                                            <div key={badge.id} class="p-4 bg-gradient-to-br from-indigo-50/50 to-white border border-indigo-100 rounded-2xl shadow-sm flex items-center gap-3">
                                                <div class="w-12 h-12 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md font-bold shrink-0">
                                                    🎖️
                                                </div>
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex justify-between items-center mb-1">
                                                        <span class="font-bold text-xs text-indigo-950">{badge.nickname}의 배지</span>
                                                        <span class="text-[10px] text-slate-400">{badge.date}</span>
                                                    </div>
                                                    <div class="text-xs text-slate-700 font-semibold truncate mb-1">
                                                        {badge.actionTitle}
                                                    </div>
                                                    <div class="text-[11px] text-slate-500 italic truncate">
                                                        "{badge.script}"
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer class="p-3 bg-slate-50 border-t border-slate-200 text-center text-[11px] text-slate-400">
                        인천대학교 청소년교육개론 발표 대안 모델 | 한 걸음 서클 v2.0
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
